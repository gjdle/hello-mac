<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hello mac</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(120, 170, 255, 0.35), transparent 60%),
        linear-gradient(180deg, #f4f6fb 0%, #e7ebf3 100%);
      color: #1d1d1f;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background:
          radial-gradient(1200px 600px at 50% -10%, rgba(80, 120, 220, 0.28), transparent 60%),
          linear-gradient(180deg, #1c1c1e 0%, #0d0d0f 100%);
        color: #f5f5f7;
      }
    }

    main {
      text-align: center;
      padding: 2rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 10vw, 6.5rem);
      font-weight: 650;
      letter-spacing: -0.045em;
    }
  </style>
</head>
<body>
  <main>
    <h1>hello mac</h1>
  </main>
</body>
</html>
